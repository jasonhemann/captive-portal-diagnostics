[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "captive-portal-diagnostics"
version = "0.1.0"
description = "Time-bounded, privacy-conscious evidence collection for captive-portal failures"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jason Hemann" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]
keywords = ["captive-portal", "wifi", "networking", "diagnostics", "pcap"]

[project.scripts]
captive-portal-diagnose = "captive_portal_diagnostics.cli:main"
captive-portal-safe-review = "captive_portal_diagnostics.safe_review:main"

[project.urls]
Issues = "https://github.com/jasonhemann/captive-portal-diagnostics/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "basedpyright>=1.31.3",
    "pyinstaller>=6.11.0; python_version < '3.16'",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"
